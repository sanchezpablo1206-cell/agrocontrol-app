<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios | AgroControl</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/crud.css">
</head>

<body>
    <div id="header"></div>
    <main class="crud-contenedor">
        <div class="crud-encabezado">
            <div>
                <h1>Gestión de usuarios</h1>
                <p>Crea cuentas, asigna perfiles y administra su acceso al sistema.</p>
            </div>
        </div>
        <div id="alerta" class="crud-alerta"></div>
        <section class="crud-panel">
            <h2 id="titulo-form">Registrar usuario</h2>
            <form id="formCrud"><input type="hidden" id="idregistro">
                <div class="crud-form-grid">
                    <div class="crud-campo"><label for="nombreu">Nombre de usuario *</label><input id="nombreu" required
                            maxlength="50"></div>
                    <div class="crud-campo"><label for="contrasena">Contraseña <span
                                id="ayuda-clave">*</span></label><input id="contrasena" type="password" minlength="8"
                            autocomplete="new-password"><small class="text-muted">Mínimo 8 caracteres. En edición,
                            déjala vacía para conservarla.</small></div>
                    <div class="crud-campo"><label for="idpersona">Persona *</label><select id="idpersona" required>
                            <option value="">Selecciona una persona</option>
                        </select></div>
                    <div class="crud-campo"><label for="idperfil">Perfil *</label><select id="idperfil" required>
                            <option value="">Selecciona un perfil</option>
                        </select></div>
                    <div class="crud-campo"><label for="rol">Rol del sistema *</label><select id="rol" required>
                            <option value="user">Usuario</option>
                            <option value="admin">Administrador</option>
                        </select></div>
                </div>
                <div class="crud-acciones-form"><button class="btn-agro btn-primario" type="submit">Guardar
                        usuario</button><button class="btn-agro btn-secundario" type="button"
                        id="cancelar">Limpiar</button></div>
            </form>
        </section>
        <section class="crud-panel">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                <h2 class="mb-0">Usuarios registrados</h2><input id="buscar" class="crud-busqueda"
                    placeholder="Buscar usuario...">
            </div>
            <div class="crud-tabla-wrap">
                <table class="crud-tabla">
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Persona</th>
                            <th>Perfil</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script type="module" src="/js/usuarios.js"></script>
</body>

</html>
