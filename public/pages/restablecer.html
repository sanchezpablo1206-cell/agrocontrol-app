<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgroControl - Nueva contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/index.css">
</head>

<body>
    <main class="login-fondo">
        <section class="login-card">
            <h1>Nueva contraseña</h1>
            <form id="formReset" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="clave1">Nueva contraseña</label>
                    <input id="clave1" type="password" class="form-control" required minlength="8">
                    <div class="invalid-feedback">Mínimo 8 caracteres</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="clave2">Confirmar contraseña</label>
                    <input id="clave2" type="password" class="form-control" required>
                    <div class="invalid-feedback" id="msgClave2">Las contraseñas no coinciden</div>
                </div>
                <div id="alerta" class="alert d-none"></div>
                <button class="btn btn-success w-100" type="submit">Guardar</button>
            </form>
            <a href="/index.html" class="d-block text-center mt-3">Volver al login</a>
        </section>
    </main>
    <script type="module" src="/js/restablecer.js"></script>
</body>

</html>
