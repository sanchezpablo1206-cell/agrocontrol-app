<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gastos | AgroControl</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/crud.css">
</head>

<body>
    <div id="header"></div>
    <main class="crud-contenedor">
        <div class="crud-encabezado">
            <div>
                <h1>Registro de gastos</h1>
                <p>Registra lo invertido en cada cultivo y clasifícalo por tipo de gasto.</p>
            </div>
        </div>

        <div id="alerta" class="crud-alerta"></div>

        <section class="crud-panel">
            <h2 id="titulo-form">Registrar gasto</h2>
            <form id="formCrud">
                <input type="hidden" id="idregistro">
                <div class="crud-form-grid">
                    <div class="crud-campo">
                        <label for="idcultivo">Cultivo *</label>
                        <select id="idcultivo" required>
                            <option value="">Selecciona un cultivo</option>
                        </select>
                        <small class="text-muted">Solo cultivos En curso.</small>
                    </div>
                    <div class="crud-campo">
                        <label for="idtipogasto">Tipo de gasto *</label>
                        <select id="idtipogasto" required>
                            <option value="">Selecciona un tipo</option>
                        </select>
                    </div>
                    <div class="crud-campo">
                        <label for="monto">Monto *</label>
                        <input id="monto" data-dinero inputmode="decimal" required placeholder="Ej. 150.000">
                        <small class="text-muted">Usa coma para los decimales.</small>
                    </div>
                    <div class="crud-campo">
                        <label for="fecha">Fecha *</label>
                        <input id="fecha" type="date" required>
                    </div>
                    <div class="crud-campo">
                        <label for="descripcion">Descripción</label>
                        <input id="descripcion" maxlength="200" placeholder="Ej. Bulto de urea 50 kg">
                    </div>
                </div>
                <div class="crud-acciones-form">
                    <button class="btn-agro btn-primario" type="submit">Guardar gasto</button>
                    <button class="btn-agro btn-secundario" type="button" id="cancelar">Limpiar</button>
                </div>
            </form>
        </section>

        <section class="crud-panel">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                <h2 class="mb-0">Gastos registrados <small id="total" class="text-muted fs-6"></small></h2>
                <input id="buscar" class="crud-busqueda" placeholder="Buscar gasto...">
            </div>
            <div class="crud-tabla-wrap">
                <table class="crud-tabla">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Cultivo</th>
                            <th>Tipo</th>
                            <th>Descripción</th>
                            <th>Monto</th>
                            <th>Usuario</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script type="module" src="/js/gastos.js"></script>
</body>

</html>
