<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis lotes | AgroControl</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/crud.css">
</head>

<body>
    <div id="header"></div>
    <main class="crud-contenedor">
        <div class="crud-encabezado">
            <div>
                <h1>Mis lotes</h1>
                <p>Registra los lotes de terreno que trabajas y consulta qué se está sembrando en cada uno.</p>
            </div>
        </div>

        <div id="alerta" class="crud-alerta"></div>

        <section class="crud-panel">
            <h2 id="titulo-form">Registrar lote</h2>
            <form id="formCrud">
                <input type="hidden" id="idregistro">
                <div class="crud-form-grid">
                    <div class="crud-campo">
                        <label for="codigol">Código *</label>
                        <input id="codigol" required maxlength="20" placeholder="Ej. L-001">
                        <small class="text-muted">El código no se puede modificar después de registrado.</small>
                    </div>
                    <div class="crud-campo">
                        <label for="descripcion">Descripción *</label>
                        <input id="descripcion" required maxlength="150" placeholder="Ej. Lote junto a la quebrada">
                    </div>
                    <div class="crud-campo">
                        <label for="area">Área (hectáreas) *</label>
                        <input id="area" type="number" required min="0.01" step="0.01" placeholder="Ej. 2.5">
                    </div>
                    <div class="crud-campo">
                        <label for="clima">Clima *</label>
                        <select id="clima" required>
                            <option value="">Selecciona el clima</option>
                            <option value="Cálido">Cálido</option>
                            <option value="Templado">Templado</option>
                            <option value="Frío">Frío</option>
                            <option value="Páramo">Páramo</option>
                        </select>
                    </div>
                </div>
                <div class="crud-acciones-form">
                    <button class="btn-agro btn-primario" type="submit">Guardar lote</button>
                    <button class="btn-agro btn-secundario" type="button" id="cancelar">Limpiar</button>
                </div>
            </form>
        </section>

        <section class="crud-panel">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                <h2 class="mb-0">Lotes registrados</h2>
                <input id="buscar" class="crud-busqueda" placeholder="Buscar lote...">
            </div>
            <div class="crud-tabla-wrap">
                <table class="crud-tabla">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descripción</th>
                            <th>Área (ha)</th>
                            <th>Clima</th>
                            <th>Cultivo en curso</th>
                            <th class="solo-admin">Productor</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script type="module" src="/js/lotes.js"></script>
</body>

</html>
