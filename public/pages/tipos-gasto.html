<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tipos de gasto | AgroControl</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/crud.css">
</head>

<body>
    <div id="header"></div>
    <main class="crud-contenedor">
        <div class="crud-encabezado">
            <div>
                <h1>Gestión de tipos de gasto</h1>
                <p>Clasifica los gastos para saber en qué se invierte más en cada cultivo.</p>
            </div>
        </div>
        <div id="alerta" class="crud-alerta"></div>
        <section class="crud-panel">
            <h2 id="titulo-form">Registrar tipo de gasto</h2>
            <form id="formCrud"><input type="hidden" id="idregistro">
                <div class="crud-form-grid">
                    <div class="crud-campo"><label for="codigotg">Código *</label><input id="codigotg" required
                            maxlength="20" placeholder="Ej. SEM"><small class="text-muted">El código no se puede
                            modificar después de registrado.</small></div>
                    <div class="crud-campo"><label for="descripcion">Descripción *</label><input id="descripcion"
                            required maxlength="100" placeholder="Ej. Semillas"></div>
                </div>
                <div class="crud-acciones-form"><button class="btn-agro btn-primario" type="submit">Guardar tipo de
                        gasto</button><button class="btn-agro btn-secundario" type="button"
                        id="cancelar">Limpiar</button></div>
            </form>
        </section>
        <section class="crud-panel">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                <h2 class="mb-0">Tipos de gasto registrados</h2><input id="buscar" class="crud-busqueda"
                    placeholder="Buscar tipo de gasto...">
            </div>
            <div class="crud-tabla-wrap">
                <table class="crud-tabla">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script type="module" src="/js/tipos-gasto.js"></script>
</body>

</html>
