<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis datos | AgroControl</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/crud.css">
</head>

<body>
    <div id="header"></div>
    <main class="crud-contenedor">
        <div class="crud-encabezado">
            <div>
                <h1>Mis datos</h1>
                <p>Consulta y actualiza tu información personal.</p>
            </div>
        </div>

        <div id="alerta" class="crud-alerta"></div>

        <section class="crud-panel">
            <h2>Información personal</h2>
            <form id="formCrud">
                <div class="crud-form-grid">
                    <div class="crud-campo">
                        <label for="ver-documento">Documento</label>
                        <input id="ver-documento" disabled>
                        <small class="text-muted">Solo el administrador puede cambiarlo.</small>
                    </div>
                    <div class="crud-campo">
                        <label for="nom1">Primer nombre *</label>
                        <input id="nom1" required maxlength="50">
                    </div>
                    <div class="crud-campo">
                        <label for="nom2">Segundo nombre</label>
                        <input id="nom2" maxlength="50">
                    </div>
                    <div class="crud-campo">
                        <label for="apell1">Primer apellido *</label>
                        <input id="apell1" required maxlength="50">
                    </div>
                    <div class="crud-campo">
                        <label for="apell2">Segundo apellido</label>
                        <input id="apell2" maxlength="50">
                    </div>
                    <div class="crud-campo">
                        <label for="movil">Celular *</label>
                        <input id="movil" required inputmode="numeric" pattern="\d{10}" maxlength="10"
                            title="Debe tener 10 dígitos">
                    </div>
                    <div class="crud-campo">
                        <label for="tele">Teléfono fijo</label>
                        <input id="tele" inputmode="numeric" pattern="\d{10}" maxlength="10"
                            title="Debe tener 10 dígitos">
                    </div>
                    <div class="crud-campo">
                        <label for="direccion">Dirección *</label>
                        <input id="direccion" required maxlength="150">
                    </div>
                    <div class="crud-campo">
                        <label for="fecha_nac">Fecha de nacimiento *</label>
                        <input id="fecha_nac" type="date" required>
                    </div>
                    <div class="crud-campo">
                        <label for="correo">Correo electrónico</label>
                        <input id="correo" type="email" maxlength="100">
                    </div>
                    <div class="crud-campo">
                        <label for="ver-estado">Estado</label>
                        <input id="ver-estado" disabled>
                    </div>
                </div>
                <div class="crud-acciones-form">
                    <button class="btn-agro btn-primario" type="submit">Guardar cambios</button>
                </div>
            </form>
        </section>
    </main>
    <script type="module" src="/js/mis-datos.js"></script>
</body>

</html>
