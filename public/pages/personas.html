<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Personas | AgroControl</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/header.css"><link rel="stylesheet" href="/css/crud.css"></head><body><div id="header"></div><main class="crud-contenedor"><div class="crud-encabezado"><div><h1>Gestión de personas</h1><p>Registra y administra la información personal.</p></div></div><div id="alerta" class="crud-alerta"></div><section class="crud-panel"><h2 id="titulo-form">Registrar persona</h2><form id="formCrud"><input type="hidden" id="idregistro"><div class="crud-form-grid">
<div class="crud-campo"><label for="nom1">Primer nombre *</label><input id="nom1" required maxlength="50"></div><div class="crud-campo"><label for="nom2">Segundo nombre</label><input id="nom2" maxlength="50"></div><div class="crud-campo"><label for="apell1">Primer apellido *</label><input id="apell1" required maxlength="50"></div><div class="crud-campo"><label for="apell2">Segundo apellido</label><input id="apell2" maxlength="50"></div><div class="crud-campo"><label for="correo">Correo electrónico *</label><input id="correo" type="email" required maxlength="100"></div><div class="crud-campo"><label for="movil">Celular</label><input id="movil" maxlength="20"></div><div class="crud-campo"><label for="tele">Teléfono</label><input id="tele" maxlength="20"></div><div class="crud-campo"><label for="direccion">Dirección</label><input id="direccion" maxlength="150"></div><div class="crud-campo"><label for="fecha_nac">Fecha de nacimiento</label><input id="fecha_nac" type="date"></div></div><div class="crud-acciones-form"><button class="btn-agro btn-primario" type="submit">Guardar persona</button><button class="btn-agro btn-secundario" type="button" id="cancelar">Limpiar</button></div></form></section><section class="crud-panel"><div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3"><h2 class="mb-0">Personas registradas</h2><input id="buscar" class="crud-busqueda" placeholder="Buscar persona..."></div><div class="crud-tabla-wrap"><table class="crud-tabla"><thead><tr><th>Identificación</th><th>Nombre completo</th><th>Correo</th><th>Celular</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="tabla"></tbody></table></div></section></main><script type="module" src="/js/personas.js"></script></body></html>
