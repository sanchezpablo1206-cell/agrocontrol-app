<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroControl - Acceso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/index.css">
</head>
<body>
  <main class="login-fondo">
    <section class="login-card container">
      <h1>🌱 AgroControl</h1>
      <p class="text-muted">Ingresa a tu cuenta</p>

      <form id="formLogin" novalidate>
        <div class="mb-3">
          <label class="form-label" for="nombreu">Usuario</label>
          <input id="nombreu" class="form-control" required minlength="3">
          <div class="invalid-feedback">Ingresa tu usuario (mínimo 3 caracteres)</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="contrasena">Contraseña</label>
          <input id="contrasena" type="password" class="form-control" required minlength="6">
          <div class="invalid-feedback">Ingresa tu contraseña (mínimo 6 caracteres)</div>
        </div>
        <div id="alerta" class="alert alert-danger d-none"></div>
        <button class="btn btn-success w-100" type="submit">Entrar</button>
      </form>

      <a href="#" class="d-block text-center mt-3" data-bs-toggle="modal" data-bs-target="#modalRecuperar">¿Olvidaste tu contraseña?</a>
    </section>
  </main>

  <!-- Modal recuperar contraseña -->
  <div class="modal fade" id="modalRecuperar" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <form id="formRecuperar" novalidate>
        <div class="modal-header"><h5 class="modal-title">Recuperar contraseña</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <p>Escribe el correo registrado y te enviaremos un enlace.</p>
          <input id="correoRec" type="email" class="form-control" placeholder="correo@ejemplo.com" required>
          <div class="invalid-feedback">Ingresa un correo válido</div>
          <div id="alertaRec" class="alert d-none mt-3"></div>
        </div>
        <div class="modal-footer"><button class="btn btn-success" type="submit">Enviar enlace</button></div>
      </form>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/index.js"></script>
</body>
</html>
